# =============================================================================
# The production stack, on one host
# =============================================================================
# The whole deployment: Postgres, the API, the web client, and Caddy in front.
# One `docker compose up`, no control plane. docs/self-hosting.md is the runbook.
#
# These are the same two images Coolify builds, so a problem here reproduces
# there and vice versa. This is *not* a development stack: every service builds
# and runs exactly as it would in production, against a real database.
# Development remains `npm run dev`.
#
#   npm run self-host        # build, start, migrate and seed — one command
#
#   # or step by step:
#   docker compose up -d --build
#   docker compose --profile tools run --rm migrate   # apply migrations
#   docker compose --profile tools run --rm seed      # first administrator
#   open https://localhost
#
# ## Why Caddy, and why nothing else publishes a port
#
# Caddy is the only service that publishes ports (80/443). The web client is not
# published, and neither is the API: the browser reaches the web client through
# Caddy, and the web client reaches the API over the private Compose network at
# `http://api:4000` through its own `/api/*` proxy. So the session cookie stays
# first-party, the API needs no certificate of its own, and TLS is terminated in
# exactly one place.
#
# Publishing `3000` or `4000` as well would put an insecure copy of the app
# beside the secure one, and on `3000` the browser would silently drop the
# Secure cookie — which reads as "login does nothing".
# =============================================================================

name: openerp

# -----------------------------------------------------------------------------
# Database
#
# A plain Postgres rather than the image: whatever you run in Coolify. The schema
# is applied by the `migrate` service below, never by an entrypoint script — see
# the ordering note on that service.
#
# Pinned to the 18 line because that is what the development database runs
# (18.6), so "works in Compose" means something. Changing this tag does not
# upgrade an existing `db-data` volume: Postgres refuses to start on a data
# directory written by an older major, so moving a live volume needs a dump and
# restore (`pg_dump` on the old image, `docker compose down -v`, restore on the
# new one) rather than a tag edit.
# -----------------------------------------------------------------------------
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: openerp
      # A real collation, not the C locale: the schema sorts job codes and
      # service codes, and C ordering puts uppercase before lowercase in a way
      # that makes "sorted" output look wrong rather than merely different.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      # NOTE: the mount point moved in Postgres 18. `postgres:18` keeps the data
      # directory at `/var/lib/postgresql` and puts the cluster in a versioned
      # subdirectory beneath it, rather than mounting the cluster itself at
      # `/var/lib/postgresql/data` as 16 and earlier did. Mounting the old path
      # on 18 either fails the initdb or leaves the cluster outside the volume.
      - db-data:/var/lib/postgresql
    healthcheck:
      # The API's migration runner needs a live server, not an open port, so this
      # runs a real query. `pg_isready` alone reports ready while the database is
      # still initialising.
      test: ['CMD-SHELL', 'pg_isready -U openerp -d openerp -q || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # No published ports. Reachable as `db:5432` inside this network only.

  # -----------------------------------------------------------------------------
  # S3 Object Storage (Garage) — Phase 3
  # -----------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node']
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-GKopenerpaccesskey01234}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-openerpsecretkey0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-openerp-attachments}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ['CMD', '/garage', '-c', '/etc/garage.toml', 'status']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # -----------------------------------------------------------------------------
  # API
  # -----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Internal service name, not localhost: localhost inside this container is
      # the API container itself.
      DATABASE_URL: postgresql://openerp:${POSTGRES_PASSWORD}@db:5432/openerp?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      AUTH_JWT_EXPIRES_IN: ${AUTH_JWT_EXPIRES_IN:-15m}
      # Hard-set, NOT interpolated from the shared `.env`. Two reasons:
      #   1. Must be true under NODE_ENV=production; `loadConfig()` throws at boot
      #      otherwise, so a `false` here is a crash loop rather than a warning.
      #   2. The development `.env` sets it to `false` (development runs over
      #      plain http://localhost:3000). Interpolating it would import that
      #      value and crash-loop the API the moment it was read.
      # Caddy terminates TLS on every path to this app, so true is also simply
      # correct here, not merely permitted.
      AUTH_COOKIE_SECURE: 'true'
      # Derived from SITE_ADDRESS so the two can never disagree — the browser's
      # origin is by definition whatever Caddy serves. A fixed value would drift
      # the moment the site address changed, and origin checks would start
      # refusing requests. A development CLIENT_ORIGIN in `.env` is ignored.
      CLIENT_ORIGIN: https://${SITE_ADDRESS:-localhost}
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      DEFAULT_CURRENCY: ZAR
      DEFAULT_VAT_RATE: '0.15'
      # S3 Object Storage (Garage)
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      S3_BUCKET: ${S3_BUCKET:-openerp-attachments}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-GKopenerpaccesskey01234}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-openerpsecretkey0123456789abcdef}
      S3_FORCE_PATH_STYLE: 'true'
    # Deliberately NOT `ports:`. Internal network only.

  # -----------------------------------------------------------------------------
  # Migrations — a one-off, never a boot step
  # -----------------------------------------------------------------------------
  #
  # Run explicitly: `docker compose run --rm migrate`
  #
  # Not a dependency of `api` on purpose. Two reasons:
  #   1. `depends_on` does not wait for *completion* of a dependency, so an
  #      ordering dependency would still race on a cold start.
  #   2. In Coolify a service that runs migrations on every boot will do so on
  #      every replica and every restart. Migrating concurrently from two
  #      containers is how a schema ends up half-applied.
  #
  # The migration runner is idempotent (it records applied names in
  # `schema_migration_ledger` and skips them), so re-running is safe — but it
  # still needs to be a deliberate single action.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://openerp:${POSTGRES_PASSWORD}@db:5432/openerp?schema=public
    # `--dry` prints the plan without writing; run it first on a new database.
    command: ['node', 'server/scripts/apply-migrations.mjs']

  # -----------------------------------------------------------------------------
  # Seed — also one-off, and refuses to create demo accounts in production
  # -----------------------------------------------------------------------------
  #
  # Run explicitly: `docker compose --profile tools run --rm seed`
  #
  # The seed is bundled into the API image as `server/dist/seed.js` — see
  # `server/build.mjs` — so it runs here without `tsx` or devDependencies, exactly
  # as it is run from a deployed container's Terminal. The bundle inlines
  # `NODE_ENV=production`, so the demo-account guard always applies here; set
  # `SEED_ADMIN_EMAIL` / `SEED_ADMIN_PASSWORD` in the host environment to create
  # the first administrator. Without the password only the RBAC catalogue is
  # provisioned.
  # -----------------------------------------------------------------------------
  seed:
    build:
      context: .
      dockerfile: Dockerfile.api
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://openerp:${POSTGRES_PASSWORD}@db:5432/openerp?schema=public
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@contractor.co.za}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    command: ['node', 'server/dist/seed.js']

  # -----------------------------------------------------------------------------
  # Web
  # -----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Read server-side per request by the `/api/*` proxy. `api:4000` is the
      # Compose service name; in Coolify it is the resource's service name.
      API_ORIGIN: http://api:4000
      # Left empty deliberately — see Dockerfile.web. Enabling these would publish
      # the demo password in the page source.
      NEXT_PUBLIC_DEMO_LOGIN: ''
      NEXT_PUBLIC_DEMO_PASSWORD: ''
      NEXT_PUBLIC_DEMO_ADMIN_PASSWORD: ''
    # Deliberately NOT `ports:`. Reachable as `web:3000` from Caddy, and through
    # Caddy from everywhere else. See the note at the top of this file.

  # -----------------------------------------------------------------------------
  # Caddy — TLS termination and the only published port
  # -----------------------------------------------------------------------------
  #
  # Terminates TLS and reverse proxies to `web`. The site address is
  # SITE_ADDRESS; `localhost` (the default) is served over HTTPS from Caddy's
  # own local CA, so the stack runs on a laptop with no DNS and no certificate
  # authority involved. For a real host, set it in `.env`:
  #
  #   SITE_ADDRESS=erp.example.co.za    # public DNS  → Let's Encrypt
  #   SITE_ADDRESS=erp.internal         # LAN-only    → local CA
  #
  # http:// is redirected to https:// in every case. `Caddyfile` explains which
  # names get which certificate, and docs/self-hosting.md covers trusting the
  # local CA so the browser stops warning.
  #
  # The certificate store lives in `caddy-data`. Without that volume every
  # restart would re-request a certificate and, on Let's Encrypt, burn the rate
  # limit within a day.
  # -----------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - '80:80'
      - '443:443'
      # HTTP/3. Harmless if the host blocks UDP; browsers fall back to HTTP/2.
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
  garage-meta:
  garage-data:
