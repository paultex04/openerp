# =============================================================================
# Coolify deployment — three services, no Caddy
# =============================================================================
# The Compose build pack, shaped for Coolify. It is deliberately a separate file
# from `docker-compose.yml` rather than the same one with overrides, because
# three things have to be different and each of them is a Coolify rule, not a
# preference:
#
#   1. NO `caddy` SERVICE. Coolify runs its own proxy (Traefik) on the host and
#      it already owns ports 80 and 443. A Caddy container publishing those same
#      ports does not "also work" — the second bind fails with
#      `address is already in use` and the whole deploy rolls back. Coolify's
#      proxy terminates TLS and routes by domain, so Caddy is not merely
#      redundant here, it is fatal.
#
#   2. NO PUBLISHED PORTS. Coolify's own documentation: "Do not publish a
#      service with `ports:` unless it must be reachable directly on a server
#      interface. A published host port bypasses domain-based proxy routing and
#      can expose an internal service." The domain is configured in the Coolify
#      UI against the `web` service and Coolify generates the proxy labels; the
#      `web` container just needs to listen on 3000 inside the network.
#
#   3. NO `migrate` OR `seed` SERVICE. They run once and exit, which is not
#      something a Coolify Compose resource models. Both are already baked into
#      the API image, so run them from the `api` container's Terminal:
#        node server/scripts/apply-migrations.mjs
#        node server/dist/seed.js
#
# ## Prerequisite: Preserve repository during deployment
#
# Coolify writes this file to `/data/coolify/services/<uuid>/` and runs
# `docker compose` from there. The repository is NOT kept in that directory
# unless you switch on **General → Build pipeline → Preserve repository during
# deployment**. Without it, `context: .` resolves to a directory holding only
# the compose file, and the build dies with:
#
#   failed to read dockerfile: open Dockerfile.api: no such file or directory
#
# With it on, `.` is the repository root, which is what the Dockerfiles expect.
#
# ## Environment
#
# Coolify reads `${VAR:?}` as "required — create an editable variable and block
# the deploy until it has a value", so DATABASE_URL below is generated by
# Coolify and AUTH_JWT_SECRET / POSTGRES_PASSWORD prompt for one.
#
# SITE_ADDRESS must be set to the domain you give the `web` service in Coolify's
# Domains tab (hostname only, no scheme). CLIENT_ORIGIN is derived from it, so
# the two cannot drift apart.
# =============================================================================

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openerp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: openerp
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openerp -d openerp -q || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://openerp:${POSTGRES_PASSWORD}@db:5432/openerp?schema=public
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?}
      AUTH_JWT_EXPIRES_IN: ${AUTH_JWT_EXPIRES_IN:-15m}
      # Pinned, never interpolated: the API refuses to start under
      # NODE_ENV=production without a secure cookie, and Coolify's proxy serves
      # HTTPS in front of this, so a literal `true` is both required and correct.
      AUTH_COOKIE_SECURE: 'true'
      # Derived from the domain configured on `web`, so the browser's origin and
      # the API's expectation cannot disagree.
      CLIENT_ORIGIN: https://${SITE_ADDRESS:-localhost}
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      DEFAULT_CURRENCY: ZAR
      DEFAULT_VAT_RATE: '0.15'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:4000
      # Left empty deliberately — a NEXT_PUBLIC_* value is inlined into the
      # client bundle at build time, so enabling these publishes the demo
      # password in the page source.
      NEXT_PUBLIC_DEMO_LOGIN: ''
      NEXT_PUBLIC_DEMO_PASSWORD: ''
      NEXT_PUBLIC_DEMO_ADMIN_PASSWORD: ''

volumes:
  db-data:
